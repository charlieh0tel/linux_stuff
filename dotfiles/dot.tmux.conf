set -g mouse
# Enable focus events
set -g focus-events on
# Enable passing through terminal features (required for some UI elements)
#set -g allow-passthrough on
# Enable extended keys (fixes Shift+Enter)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g history-limit 5000
set -g set-titles on
setw -g allow-rename on
