name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck libdevice-serialport-perl libcurses-perl libexpect-perl
      - run: make lint
